[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "18"

[functions]
  node_bundler = "esbuild"
  included_files = ["prisma/**/*.prisma"]

# Head-only: newest auction page each run (full backfill: `npm run auction-sync:full` locally).
# Cron is minute-resolution; for true 30s polling use the Node script or an external scheduler.
[functions."sync-auction-house"]
  schedule = "* * * * *"

[[redirects]]
  from = "/card/*"
  to = "/.netlify/functions/serve-card-image?id=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  port = 8888
